[package]
name = "game-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.28"
glutin = "0.30"
glow = "0.15"
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
image = "0.24"
rodio = "0.17"
env_logger = "0.10"
log = "0.4"
anyhow = "1.0"
thiserror = "1.0"
bytemuck = "1.0"
num_cpus = "1.0"
rayon = "1.7"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "game-engine"
path = "src/main.rs"