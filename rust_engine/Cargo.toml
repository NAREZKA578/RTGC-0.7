[package]
name = "rust_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Graphics & Rendering
wgpu = "0.18"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.25"

# Terrain & Noise
noise = "0.9"
rand = "0.8"

# Physics
rapier3d = "0.17"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization (save system)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Gamepad input
gilrs = "0.10"

# Audio
rodio = "0.17"

# Logging
log = "0.4"
env_logger = "0.10"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
